<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>[DEV] Locked</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #15171a; color: #e8e6e3;
         font: 16px/1.4 system-ui, -apple-system, Segoe UI, Roboto, sans-serif; }
  form { width: min(340px, calc(100vw - 32px)); background: #1f2226; border: 1px solid #33373d; border-radius: 10px; padding: 24px; box-sizing: border-box; }
  h1 { font-size: 18px; margin: 0 0 4px; }
  p { margin: 0 0 16px; color: #9aa0a6; font-size: 14px; }
  input[type=password] { width: 100%; box-sizing: border-box; padding: 10px 12px; font-size: 16px; border-radius: 6px;
         border: 1px solid #43484f; background: #121417; color: inherit; }
  label { display: flex; gap: 8px; align-items: center; margin: 12px 0 16px; font-size: 14px; color: #9aa0a6; }
  button { width: 100%; padding: 10px; font-size: 16px; border: 0; border-radius: 6px; background: #d9822b; color: #111; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .6; cursor: wait; }
  #err { color: #ff7b72; min-height: 20px; margin: 10px 0 0; font-size: 14px; }
  a { color: #9aa0a6; font-size: 14px; display: block; text-align: center; margin-top: 14px; }
</style>
</head>
<body>
<form id="f" hidden>
  <h1>Dev preview</h1>
  <p>This page is password protected.</p>
  <input id="pw" type="password" autocomplete="current-password" placeholder="Password" autofocus>
  <label><input id="rem" type="checkbox" checked> Remember on this device</label>
  <button id="go">Unlock</button>
  <div id="err"></div>
  <a href="/">Back to the vehicle tool</a>
</form>
<script>
(() => {
  const SALT = '247a1b7a710674d0570cea28f3bea720', ITER = 600000, SRC = 'p.bin?v=11934bb9bb', STORE = 'atfDevKey';
  const hex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const $ = id => document.getElementById(id);
  const blobP = fetch(SRC).then(r => { if (!r.ok) throw new Error('load'); return r.arrayBuffer(); });

  async function derive(pw) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: hex(SALT), iterations: ITER }, base, 256));
  }
  async function open(raw) {
    const buf = new Uint8Array(await blobP);
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: buf.slice(0, 12) }, key, buf.slice(12));
    const text = await new Response(new Blob([plain]).stream().pipeThrough(new DecompressionStream('gzip'))).text();
    return JSON.parse(text);
  }
  function show(p) {
    const pics = {};
    for (const [k, v] of Object.entries(p.pics)) pics[k] = URL.createObjectURL(new Blob([b64(v)], { type: 'image/webp' }));
    window.__ATF_PIC = pics;
    const files = p.files, realFetch = window.fetch.bind(window);
    window.fetch = (u, o) => {
      const name = typeof u === 'string' ? u.split('?')[0].split('/').pop() : '';
      return name in files ? Promise.resolve(new Response(files[name], { headers: { 'Content-Type': 'application/json' } })) : realFetch(u, o);
    };
    document.open(); document.write(p.html); document.close();
  }
  const keyStr = raw => btoa(String.fromCharCode(...raw));
  async function tryStored() {
    let s = null; try { s = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) {}
    if (s && s.salt === SALT) {
      try { show(await open(b64(s.key))); return; } catch (e) { try { localStorage.removeItem(STORE); } catch (e2) {} }
    }
    $('f').hidden = false; $('pw').focus();
  }
  $('f').addEventListener('submit', async ev => {
    ev.preventDefault();
    $('go').disabled = true; $('err').textContent = '';
    try {
      const raw = await derive($('pw').value);
      const p = await open(raw);
      if ($('rem').checked) try { localStorage.setItem(STORE, JSON.stringify({ salt: SALT, key: keyStr(raw) })); } catch (e) {}
      show(p);
    } catch (e) {
      $('err').textContent = e && e.message === 'load' ? 'Could not load the page. Try again.' : 'Wrong password.';
      $('go').disabled = false;
    }
  });
  tryStored();
})();
</script>
</body>
</html>
